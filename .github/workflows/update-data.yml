name: Mise à jour données épidémiologiques

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Mettre à jour les données
        run: node scripts/update-data.js

      - name: Commit et push si changements
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add epidemiology.json
          git diff --staged --quiet || git commit -m "chore: mise à jour automatique $(date -u +%Y-%m-%d)"
          git push
