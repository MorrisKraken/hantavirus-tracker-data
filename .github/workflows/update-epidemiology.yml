name: Update Epidemiology Data

on:
  # Cron désactivé — le script GDELT utilisait des comptages d'articles
  # comme proxy de cas (ex: 250 articles = d7:250), ce qui produisait
  # des valeurs complètement fausses. Réactiver uniquement après refonte
  # du script avec une source officielle de cas (WHO GHO, PAHO API).
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:  # Déclenchement manuel uniquement

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run data update script
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add epidemiology.json
          if git diff --staged --quiet; then
            echo "Aucune modification — pas de commit"
          else
            git commit -m "auto: mise à jour épidémiologique $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
